services:
  backend:
    container_name: backend
    build:
      context: .
      dockerfile: backend/mysetting/Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - ./tmp/db:/var/lib/postgresql/data

  app:
    container_name: app
    build: 
      context: ./app
      dockerfile: mysetting/Dockerfile
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec puma -C config/puma.rb"
    depends_on:
      - backend
    volumes:
      - ./app/spend-management-webapp-app:/spend-management-webapp-app
      - public-data:/spend-management-webapp/public
      - tmp-data:/spend-management-webapp-app/tmp

  frontend:
    container_name: frontend
    build: 
      context: ./frontend/
      dockerfile: mysetting/Dockerfile
    volumes:
      - ./frontend/mysetting/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/spend-management-webapp-frontend:/home/node/app
      - public-data:/spend-management-webapp/public
      - tmp-data:/spend-management-webapp-app/tmp
    ports:
      - "3000:80"
    depends_on:
      - app

volumes:
  public-data:
  tmp-data:
